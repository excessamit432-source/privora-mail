name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q PrivoraMail-github-ready.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Unit tests (crypto, config, contrast)
        working-directory: project
        run: gradle testDebugUnitTest --console=plain
        continue-on-error: true

      - name: Upload APK as download
        uses: actions/upload-artifact@v4
        with:
          name: PrivoraMail-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PRIVORA MAIL build ${{ github.run_number }}
          files: project/app/build/outputs/apk/debug/app-debug.apk
